<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IRONLOG — Owner Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">

    <div class="d-flex align-items-center gap-3 mb-4">
      <div class="auth-mark">IL</div>
      <div>
        <div class="ig-brand mb-0">IRON<span>LOG</span></div>
        <div class="eyebrow">IRONLOG · Owner Console</div>
      </div>
    </div>

    <h1 class="h4 mb-1" style="font-family:var(--font-body); text-transform:none; letter-spacing:0;">Sign in to your gym</h1>
    <p class="text-muted-2 mb-4" style="font-size:0.9rem;">Manage members, memberships, and daily gym operations from one secure owner dashboard.</p>

    <div id="loginError" class="auth-error mb-3"></div>
    <div id="expiredNotice" class="auth-error mb-3" style="display:none; color: var(--muted); border-color: var(--line); background: var(--panel-2);">
      Your session expired. Please sign in again.
    </div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input type="email" class="form-control" id="email" placeholder="owner@yourgym.com" required autocomplete="username">
      </div>

      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <div class="input-group">
          <input type="password" class="form-control" id="password" placeholder="••••••••" required autocomplete="current-password">
          <button class="btn btn-outline-line" type="button" id="togglePw" tabindex="-1" aria-label="Show password">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="remember" checked>
        <label class="form-check-label" for="remember">Keep me signed in on this device</label>
      </div>

      <button type="submit" class="btn btn-accent w-100 py-2" id="loginBtn">
        <span id="loginBtnText">Log in</span>
        <span id="loginSpinner" class="spinner-border spinner-border-sm ms-2" style="display:none;"></span>
      </button>
    </form>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/login.js"></script>
</body>
</html>
